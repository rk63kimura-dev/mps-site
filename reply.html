<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE PEACE｜お客様へ返信</title>
<style>
:root{--bg:#f6f0e8;--card:#fff;--ink:#2b211c;--muted:#8a7060;--accent:#315c3b;--line:#ddcdbd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.brand{font-weight:800;letter-spacing:.08em;font-size:24px;margin:8px 0 20px}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 6px 24px rgba(60,40,20,.08)}
.label{font-size:13px;color:var(--muted);margin-bottom:7px}
.customer{font-size:22px;font-weight:700;margin-bottom:18px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.preset{border:1px solid var(--line);background:#fffaf5;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:700;color:var(--ink)}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;font-size:16px;line-height:1.6;background:#fff}
.count{text-align:right;font-size:12px;color:var(--muted);margin-top:5px}
.send{width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:15px;font-size:18px;font-weight:800}
.send:disabled{opacity:.45}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
.status{display:none;margin-top:14px;padding:13px;border-radius:12px;font-weight:700}
.status.show{display:block}
.status.ok{background:#e7f4ea;color:#24562f}
.status.err{background:#fde8e8;color:#8b2c2c}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">THE PEACE</div>
  <div class="card">
    <div class="label">お客様へ返信</div>
    <div class="customer" id="customer">ご注文のお客様</div>

    <div class="presets">
      <button class="preset" data-message="ご予約の商品をご用意できました。ご来店お待ちしております。">✅ 準備できました</button>
      <button class="preset" data-message="申し訳ありません。ご用意にあと5分ほどお時間をいただきます。">⏱ 5分ほど遅れます</button>
      <button class="preset" data-message="申し訳ありません。ご注文商品の一部が品切れとなっております。内容の確認のためご返信をお願いいたします。">⚠️ 品切れ</button>
      <button class="preset" data-message="">✏️ 自由入力</button>
    </div>

    <textarea id="message" maxlength="500" placeholder="お客様へ送るメッセージを入力してください"></textarea>
    <div class="count"><span id="count">0</span>/500</div>

    <button class="send" id="sendBtn">このお客様へ送信</button>
    <div class="status" id="status"></div>

    <div class="note">※このページは注文通知の専用リンクから開いてください。送信先は注文ごとに安全に確認されます。</div>
  </div>
</div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzXwYj0UUbFs0yCvQXOgxQX5571LWm2eifE0_MpW-B7VslnQFsFRkSGgfx8RlS8lneBOQ/exec';
const qs=new URLSearchParams(location.search);
const row=qs.get('row')||'';
const token=qs.get('token')||'';
const name=qs.get('name')||'';

const customer=document.getElementById('customer');
const message=document.getElementById('message');
const count=document.getElementById('count');
const sendBtn=document.getElementById('sendBtn');
const status=document.getElementById('status');

customer.textContent=name ? name+' 様' : 'ご注文のお客様';

document.querySelectorAll('.preset').forEach(btn=>{
  btn.addEventListener('click',()=>{
    message.value=btn.dataset.message||'';
    message.dispatchEvent(new Event('input'));
    message.focus();
  });
});

message.addEventListener('input',()=>{ count.textContent=message.value.length; });

function showStatus(text,kind){
  status.textContent=text;
  status.className='status show '+kind;
}

sendBtn.addEventListener('click',async()=>{
  const body=message.value.trim();
  if(!row||!token){
    showStatus('返信用情報が不足しています。注文通知のリンクから開いてください。','err');
    return;
  }
  if(!body){
    showStatus('メッセージを入力してください。','err');
    return;
  }
  if(!confirm((name ? name+' 様へ' : 'このお客様へ')+'送信しますか？')) return;

  sendBtn.disabled=true;
  sendBtn.textContent='送信中…';
  try{
    await fetch(GAS_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        type:'customerReply',
        row:Number(row),
        token,
        message:body
      })
    });
    showStatus('送信しました。','ok');
    sendBtn.textContent='送信済み';
  }catch(e){
    showStatus('送信できませんでした。通信状態をご確認ください。','err');
    sendBtn.disabled=false;
    sendBtn.textContent='このお客様へ送信';
  }
});
</script>
</body>
</html>
