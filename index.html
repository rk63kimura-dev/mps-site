<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe2">
  <meta name="description" content="Mother's Peace Sandwiches メニュー">
  <title>MENU | Mother's Peace Sandwiches</title>
  <style>
    :root {
      --bg: #f6efe2;
      --paper: #fffaf2;
      --ink: #342117;
      --green: #234b2d;
      --red: #a52721;
      --shadow: 0 8px 28px rgba(71, 45, 28, .15);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.9), transparent 32rem),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", "Noto Sans JP", sans-serif;
    }

    header {
      padding: max(24px, env(safe-area-inset-top)) 16px 18px;
      text-align: center;
    }

    .brand {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 6vw, 34px);
      line-height: 1.15;
      letter-spacing: .02em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(246, 239, 226, .92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(52, 33, 23, .08);
      border-bottom: 1px solid rgba(52, 33, 23, .08);
    }

    nav a {
      flex: 1 1 0;
      max-width: 220px;
      padding: 11px 8px;
      border-radius: 999px;
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 3px 10px rgba(52, 33, 23, .12);
    }

    nav a:first-child { background: var(--green); }
    nav a:last-child { background: var(--red); }

    main {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 18px 12px 42px;
    }

    section {
      scroll-margin-top: 72px;
      margin-bottom: 28px;
    }

    h2 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 18px;
      letter-spacing: .05em;
    }

    .menu-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    footer {
      padding: 4px 16px calc(24px + env(safe-area-inset-bottom));
      text-align: center;
      color: rgba(52, 33, 23, .62);
      font-size: 12px;
    }

    @media (min-width: 700px) {
      main { padding-left: 24px; padding-right: 24px; }
      .menu-image { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="brand">Mother’s Peace Sandwiches</h1>
    <p class="subtitle">MENU</p>
  </header>

  <nav aria-label="メニュー切り替え">
    <a href="#eatin">店内メニュー</a>
    <a href="#takeout">テイクアウト</a>
  </nav>

  <main>
    <section id="eatin" aria-labelledby="eatin-title">
      <h2 id="eatin-title">店内メニュー</h2>
      <img class="menu-image" src="eatin-menu.jpg" alt="店内朝食メニュー" width="1024" height="1536">
    </section>

    <section id="takeout" aria-labelledby="takeout-title">
      <h2 id="takeout-title">テイクアウトメニュー</h2>
      <img class="menu-image" src="takeout-menu.jpg" alt="テイクアウトメニュー" width="1024" height="1536" loading="lazy">
    </section>
  </main>

  <footer>Mother’s Peace Sandwiches</footer>
</body>
</html>
